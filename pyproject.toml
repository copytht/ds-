[project]
name = "dsb"
version = "0.1.0"
description = "本机 HTTP 中继：把扩展的问题转给 opencode、把答复转回扩展（不是 MCP 服务）"
readme = "README.md"
authors = [{ name = "as", email = "as@given.su" }]
requires-python = ">=3.13"
# 中继只用标准库（http.server + urllib）：opencode 的 HTTP API 由 dsb/client.py 直连，
# 不引 MCP，也不引任何 TOON 库（编码归扩展）。
dependencies = []

[project.scripts]
dsb = "dsb.server:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

# 扁平布局：包就在仓库根的 dsb/，src/ 留给浏览器扩展。
# module-name 显式写死，否则 uv_build 会按 project 名推成 ds_mcp。
[tool.uv.build-backend]
module-root = ""
module-name = "dsb"

[tool.ruff]
line-length = 100
target-version = "py313"
# 技能库是别人家的代码，不进本仓库的格式与静态检查。
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
